name: Windows checks
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run protocol tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($target in @('CoreTests','ProfileTests','ApiTests','ConversationTests','HistoryTests','StreamingTests','VoicePresetTests','LiveTests','UpdateTests','UpdateApplyTests','GreetingTests','StartupTests','ProxyTests','QueueTests','DictationTests','InteractionTests','SpriteAlignmentTests','ProviderTests','ImportedSkinTests','AiGreetingTests','BundledSkinTests')) {
            & .\Build.ps1 -Target $target
            if ($LASTEXITCODE -ne 0) { throw "Failed: $target" }
          }
      - name: Compile application
        shell: powershell
        run: .\Build.ps1 -Target App
      - name: Verify release archive can be applied by the updater
        shell: powershell
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python tests/PackagingSmoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Release archive verification failed' }
