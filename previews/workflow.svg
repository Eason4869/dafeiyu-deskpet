<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-label="桌面伙伴0.5.1使用流程：双击快速对话并展开完整聊天，中键打开动作轮盘，Live在当前窗口内显示；四项设置导航和十三步实操引导">
  <rect width="1000" height="680" rx="22" fill="#F7F9FD"/>
  <g font-family="Microsoft YaHei UI,Microsoft YaHei,Arial,sans-serif">
