    <g fill="#FFFFFF" stroke="#DCE5F4" stroke-width="1.5">
      <rect x="40" y="86" width="240" height="120" rx="16"/>
      <rect x="380" y="86" width="240" height="120" rx="16"/>
      <rect x="720" y="86" width="240" height="120" rx="16"/>
      <rect x="40" y="266" width="240" height="140" rx="16"/>
      <rect x="380" y="266" width="580" height="140" rx="16"/>
      <rect x="40" y="450" width="920" height="188" rx="16"/>
    </g>
    <g text-anchor="middle">
      <g fill="#203754" font-size="21" font-weight="600">
