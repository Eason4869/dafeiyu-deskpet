    <text x="62" y="486" fill="#203754" font-size="21" font-weight="600">设置与新手引导</text>
    <text x="62" y="520" fill="#203754" font-size="16">伙伴（伙伴与人格 / 陪伴方式 / 主动问候）　　AI 配置　　快捷键　　关于</text>
    <text x="62" y="551" fill="#456DE6" font-size="15">AI 配置</text><text x="148" y="551" fill="#61738B" font-size="15">文字模型 / 语音识别 / 声音与朗读 / Live 实时语音</text>
