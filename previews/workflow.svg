    <g stroke="#456DE6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M296 154h67m-9-7 9 7-9 7"/><path d="M636 154h67m-9-7 9 7-9 7"/>
      <path d="M160 218v35m-7-8 7 8 7-8"/>
      <path d="M500 218v35m-7-8 7 8 7-8"/><path d="M840 218v35m-7-8 7 8 7-8"/>
