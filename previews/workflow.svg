        <text x="160" y="306">中键动作轮盘</text><text x="670" y="306">窗口内 Live 通话</text>
      </g>
      <g fill="#61738B" font-size="15">
        <text x="160" y="156">摸头、戳身体、拖动定位</text><text x="160" y="181">E包 / 大肥鱼 / 马尔芙</text>
        <text x="500" y="156">在头顶写一句话</text><text x="500" y="181">头像旁喇叭开关朗读</text>
        <text x="840" y="156">共享消息、查看历史</text><text x="840" y="181">文字 / ASR + TTS</text>
        <text x="160" y="337">动作：九组基础动作</text><text x="160" y="365">技能：投喂、小憩、专属动作</text>
